[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
description = "Incident Response Copilot — RAG, agentic retrieval, and multi-agent orchestration over a synthetic infra corpus."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "chromadb>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Pulls in torch (multiple GB on Linux), so it's opt-in; anything that needs
# real embeddings goes through meridian.indexing.embeddings and CI runs on the
# dependency-free HashingEmbedder instead.
local-embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
